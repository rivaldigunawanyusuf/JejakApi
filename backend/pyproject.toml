[project]
name = "jejak-backend"
version = "0.1.0"
description = "JEJAK API - Peatland Fire Risk Intelligence Backend (FastAPI + DuckDB)"
authors = [{name = "Rivaldi Gunawan Yusuf", email = "rivaldigunawanyusuf@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
