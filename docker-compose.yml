services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jejak-api-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - FASTAPI_PORT=8000
      - DATA_PARQUET_PATH=/app/data/oki_risk_latest.parquet
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY:-}
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jejak-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jejak-api-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jejak-network

networks:
  jejak-network:
    driver: bridge
